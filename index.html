<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c10" />
    <!-- Title, description, social tags and JSON-LD are injected by vite-plugin-seo.js from src/lib/content.js -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='none' stroke='%237c5cff' stroke-width='14'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
